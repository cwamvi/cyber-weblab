<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - Golpes: Evite Fraudes</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header>
    <a class="logo" href="../index.html">Evite Fraudes</a>

    <nav>
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="content.html">Golpes Financeiros</a></li>
        <li><a href="content2.html">Golpes Digitais</a></li>
        <li><a href="seguranca.html">Gerador de Senhas</a></li>
        <li><a href="sobre.html">Sobre o Grupo</a></li>
        <li><a class="ativo" href="contato.html">Contato</a></li>
      </ul>
    </nav>

    <div class="botoes">
      <button id="btn-tema" type="button" title="Alternar tema claro e escuro">
        <span id="icone-tema" class="material-icons">dark_mode</span>
      </button>
      <button id="btn-fonte" type="button" title="Alterar tamanho da fonte">
        <span class="material-icons">accessibility</span>
      </button>
    </div>
  </header>

  <main>
    <h1>Contato</h1>
    <p>Tem alguma dúvida ou sugestão? Escreva para nós.</p>

    <!-- O envio é tratado em js/main.js (mostra o alerta "Página em construção") -->
    <section class="card">
      <form id="form-contato">

        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="assunto">Assunto</label>
        <input type="text" id="assunto" name="assunto" required>

        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" rows="6" required></textarea>

        <button class="btn" type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Projeto acadêmico baseado na cartilha "Golpes: Evite Fraudes" do CERT.br/NIC.br.</p>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
